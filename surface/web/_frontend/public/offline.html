<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>pi 暂时离线</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #ffffff;
        color: #1a1c1f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      main {
        width: min(100%, 420px);
        text-align: center;
      }

      img {
        width: 88px;
        height: 88px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 22px;
        font-weight: 650;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: #6b7280;
        font-size: 14px;
        line-height: 1.6;
      }

      button {
        margin-top: 24px;
        min-height: 40px;
        padding: 0 18px;
        border: 1px solid rgba(26, 28, 31, 0.12);
        border-radius: 10px;
        background: #f7f7f7;
        color: #1a1c1f;
        font: inherit;
        cursor: pointer;
      }

      button:hover {
        background: rgba(26, 28, 31, 0.095);
      }

      button:focus-visible {
        outline: 2px solid #0a84ff;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>pi 暂时离线</h1>
      <p>请重新连接 pi Web 服务，然后再试一次。</p>
      <button type="button" onclick="location.reload()">重新加载</button>
    </main>
  </body>
</html>
