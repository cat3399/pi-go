plugins {
    id 'com.android.application'
}

def piGoVersion = System.getenv("PI_GO_VERSION") ?: "0.1.0-dev"
def piGoVersionMatch = piGoVersion =~ /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:[-+].*)?$/
if (!piGoVersionMatch.matches()) {
    throw new GradleException("PI_GO_VERSION must be a semantic version, got: ${piGoVersion}")
}
def piGoVersionMajor = piGoVersionMatch.group(1).toInteger()
def piGoVersionMinor = piGoVersionMatch.group(2).toInteger()
def piGoVersionPatch = piGoVersionMatch.group(3).toInteger()
if (piGoVersionMajor > 2100 || piGoVersionMinor > 999 || piGoVersionPatch > 999) {
    throw new GradleException("PI_GO_VERSION is too large for Android versionCode: ${piGoVersion}")
}
def piGoVersionCode = Math.max(1, piGoVersionMajor * 1000000 + piGoVersionMinor * 1000 + piGoVersionPatch)

android {
    namespace 'com.wails.app'
    compileSdk 35
    buildToolsVersion '35.0.0'

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.cat3399.pigo"
        minSdk 26
        targetSdk 35
        versionCode piGoVersionCode
        versionName piGoVersion

        // Configure supported ABIs
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    def keystoreFile = System.getenv("ANDROID_KEYSTORE_FILE")
    def hasKeystore = keystoreFile != null && !keystoreFile.trim().isEmpty()

    signingConfigs {
        // A real keystore can be provided via environment variables; without
        // one, release builds are signed with the debug keystore so they can
        // be installed for testing (not suitable for Play Store uploads).
        release {
            if (hasKeystore) {
                storeFile file(keystoreFile)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Source sets configuration
    sourceSets {
        main {
            // JNI libraries are in jniLibs folder
            jniLibs.srcDirs = ['src/main/jniLibs']
            // Assets for the WebView
            assets.srcDirs = ['src/main/assets']
        }
    }

    // Packaging options
    packagingOptions {
        // Don't strip Go symbols in debug builds
        doNotStrip '*/arm64-v8a/libwails.so'
        doNotStrip '*/x86_64/libwails.so'
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
