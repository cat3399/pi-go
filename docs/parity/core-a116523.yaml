schemaVersion: 1

upstream:
  repository: ../pi
  commit: a116523434806910336b9de3e38a41aa5860030b
  productionChain:
    - AgentSessionRuntime
    - AgentSession
    - Agent
    - AgentLoop
    - SessionManager

scope:
  included:
    - provider-neutral model, message, tool, event, hook, and stream contracts
    - AgentLoop and stateful Agent behavior
    - coding-agent AgentSession policy and lifecycle
    - JSONL SessionManager semantics and compatibility
    - Runtime session replacement lifecycle
    - built-in coding tools, resources, settings, auth, and production provider adapters
  deferred:
    - name: JavaScript extension loader and extension UI
      reason: The loader and UI are explicitly deferred; their transport-neutral hook and custom-data contracts remain in scope.
      upstreamPath: packages/coding-agent/src/core/extensions
    - name: TUI, GUI, and complete legacy RPC command exposure
      reason: These are Surface adapters and do not define Agent Core semantics.
      upstreamPath: packages/coding-agent/src/modes
    - name: PiClient, SessionLease, CBOR protocol, and remote server deployment
      reason: These are remote-client and transport products, not the pinned coding-agent production AgentSession chain.
      upstreamPath: packages/client
    - name: AgentHarness SessionRepository and SQLite store
      reason: AgentHarness is an exported upstream library direction but is not the pinned coding-agent production state owner.
      upstreamPath: packages/agent/src/harness

statusDefinitions:
  oracle_verified: A frozen scenario generated through the pinned upstream production implementation is asserted by Go.
  source_aligned: The production behavior is implemented and tested from the pinned source contract but lacks a frozen end-to-end upstream oracle.
  remaining: A real product-integration difference remains at the named Go boundary.

capabilities:
  - id: agent_loop.streaming_lifecycle
    category: agent_loop
    status: oracle_verified
    upstream:
      path: packages/agent/src/agent-loop.ts
      symbol: streamAssistantResponse
    go:
      path: internal/agent/agent_loop.go
      symbol: func (l *AgentLoop) streamAssistant
    surfaceExposure: {application: not_applicable, jsonl: not_applicable, http: not_applicable}
    evidence:
      - {kind: go_test, path: internal/agent/agent_loop_test.go, symbol: TestAgentLoopStreamingLifecycle}
      - {kind: upstream_oracle, path: internal/agent/upstream_workflow_oracle_test.go, symbol: TestUpstreamAgentSessionWorkflowOracle}
    intentionalGoDifference: Pull-based Go EventStream and context cancellation replace AsyncIterable and AbortSignal.
    remainingDifference: none

