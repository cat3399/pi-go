name: Self-update tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'internal/selfupdate/**'
      - 'internal/product/**'
      - 'internal/filelock/**'
      - 'internal/installation/**'
      - 'surface/cli/**'
      - 'cmd/pi-go/**'
      - 'scripts/*'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/test-update.yml'
  push:
    branches: [main]
    paths:
      - 'internal/selfupdate/**'
      - 'internal/product/**'
      - 'internal/filelock/**'
      - 'internal/installation/**'
      - 'surface/cli/**'
      - 'cmd/pi-go/**'
      - 'scripts/*'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/test-update.yml'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test portable update scenarios
        run: go test -race -count=1 ./internal/selfupdate ./internal/product ./surface/cli ./cmd/pi-go
      - name: Vet update packages
        run: go vet ./internal/selfupdate ./internal/product ./surface/cli ./cmd/pi-go
