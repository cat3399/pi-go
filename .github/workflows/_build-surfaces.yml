name: Build surfaces (reusable)

on:
  workflow_call:
    inputs:
      surface:
        description: Surface to build
        required: true
        type: string
      version:
        description: Semantic version embedded in artifacts
        required: true
        type: string
      production:
        description: Build production variants where a surface supports them
        required: false
        default: false
        type: boolean
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      terminal: ${{ steps.selection.outputs.terminal }}
      web: ${{ steps.selection.outputs.web }}
      gui: ${{ steps.selection.outputs.gui }}
      mobile: ${{ steps.selection.outputs.mobile }}
    steps:
      - name: Validate surface and version
        id: selection
        env:
          SURFACE: ${{ inputs.surface }}
          VERSION: ${{ inputs.version }}
        run: |
          terminal=false
          web=false
          gui=false
          mobile=false
          if [[ "$SURFACE" == all ]]; then
            terminal=true
            web=true
            gui=true
            mobile=true
          else
            IFS=',' read -ra selected <<< "$SURFACE"
            if (( ${#selected[@]} == 0 )); then
              echo "Surface selection is empty" >&2
              exit 2
            fi
            for item in "${selected[@]}"; do
              case "$item" in
                terminal) terminal=true ;;
                web) web=true ;;
                gui) gui=true ;;
                mobile) mobile=true ;;
                *) echo "Unsupported surface: $item" >&2; exit 2 ;;
              esac
            done
          fi
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $VERSION" >&2
            exit 2
          fi
          {
            echo "terminal=$terminal"
            echo "web=$web"
            echo "gui=$gui"
            echo "mobile=$mobile"
          } >> "$GITHUB_OUTPUT"

  terminal:
    name: Terminal · portable
    if: needs.validate.outputs.terminal == 'true'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go with module and build cache
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build and package terminal targets
        env:
          VERSION: ${{ inputs.version }}
        run: ./scripts/package-portable.sh terminal "$VERSION" dist

      - name: Upload terminal packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-terminal
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  web:
    name: Web · portable
    if: needs.validate.outputs.web == 'true'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go with module and build cache
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node with npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            surface/ui/package-lock.json
            surface/web/_frontend/package-lock.json

      - name: Restore Next build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: surface/web/_frontend/.next/cache
          key: web-next-${{ runner.os }}-${{ hashFiles('surface/ui/package-lock.json', 'surface/web/_frontend/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            web-next-${{ runner.os }}-${{ hashFiles('surface/ui/package-lock.json', 'surface/web/_frontend/package-lock.json') }}-

      - name: Build frontend once and package web targets
        env:
          VERSION: ${{ inputs.version }}
        run: ./scripts/package-portable.sh web "$VERSION" dist

      - name: Upload web packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-web
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  gui:
    name: GUI · ${{ matrix.target }}
    if: needs.validate.outputs.gui == 'true'
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-amd64
          - runner: windows-2025
            target: windows-amd64
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go with module and build cache
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: surface/gui/go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            surface/gui/go.sum

      - name: Set up Node with npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            surface/ui/package-lock.json
            surface/gui/frontend/package-lock.json

      - name: Install Linux WebView build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install frontend dependencies
        shell: bash
        run: |
          npm --prefix surface/ui ci
          npm --prefix surface/gui/frontend ci

      - name: Build and package native GUI
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
        run: ./scripts/package-gui.sh "$VERSION" "$TARGET" dist

      - name: Upload GUI package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-gui-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  mobile:
    name: Mobile · Android arm64 · ${{ inputs.production && 'release' || 'debug' }}
    if: needs.validate.outputs.mobile == 'true'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_NDK_VERSION: 26.3.11579264
      WAILS_VERSION: v3.0.0-beta.8
      EXPECTED_ANDROID_CERT_SHA256: c1e95eadc815e6b5419f9fa1ef541ac35771d22816b4981afe1d0729b2bf6578
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go with module and build cache
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: surface/mobile/go.mod
          cache: true
          cache-dependency-path: surface/mobile/go.sum

      - name: Set up Node with npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            surface/ui/package-lock.json
            surface/mobile/frontend/package-lock.json

      - name: Set up Java with Gradle cache
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            surface/mobile/build/android/*.gradle
            surface/mobile/build/android/app/*.gradle
            surface/mobile/build/android/gradle/wrapper/gradle-wrapper.properties

      - name: Configure fixed Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_FILE: ${{ runner.temp }}/pi-go-signing.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "The four Android signing secrets must all be configured" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          cert_sha256=$(keytool -exportcert -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | sha256sum | awk '{print $1}')
          if [[ "$cert_sha256" != "$EXPECTED_ANDROID_CERT_SHA256" ]]; then
            echo "Unexpected Android signing certificate: $cert_sha256" >&2
            exit 1
          fi
          echo "Using Android signing certificate SHA-256: $cert_sha256"

      - name: Restore pinned Android NDK
        id: ndk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/ndk/26.3.11579264
          key: android-ndk-${{ runner.os }}-26.3.11579264

      - name: Install pinned Android NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ANDROID_NDK_VERSION" > /dev/null

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0

      - name: Restore pinned Wails CLI
        id: wails-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: go-tool-${{ runner.os }}-${{ runner.arch }}-wails-server-3.0.0-beta.8

      - name: Install Wails
        run: |
          tool_bin="$(go env GOPATH)/bin"
          mkdir -p "$tool_bin"
          if [[ ! -x "$tool_bin/wails3" ]]; then
            CGO_ENABLED=0 go install -tags server github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          fi
          echo "$tool_bin" >> "$GITHUB_PATH"
          task --version
          "$tool_bin/wails3" version

      - name: Install frontend dependencies
        run: make setup SURFACE=mobile

      - name: Build versioned Android APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/pi-go-signing.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PI_GO_ANDROID_BUILD_TYPE: ${{ inputs.production && 'release' || 'debug' }}
          VERSION: ${{ inputs.version }}
        run: |
          output_dir="$RUNNER_TEMP/pi-go-mobile"
          make build SURFACE=mobile VERSION="$VERSION" OUTPUT_DIR="$output_dir"
          mkdir -p dist
          cp "$output_dir/pi-go-mobile.apk" "dist/pi-go-mobile_${VERSION}_android_arm64.apk"
          apk="dist/pi-go-mobile_${VERSION}_android_arm64.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -n 1
          cert_sha256=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          if [[ "$cert_sha256" != "$EXPECTED_ANDROID_CERT_SHA256" ]]; then
            echo "APK was signed by an unexpected certificate: $cert_sha256" >&2
            exit 1
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-mobile
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
