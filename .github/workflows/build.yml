name: Build
run-name: Build ${{ inputs.surface }} · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      surface:
        description: Surface to build (all builds every surface)
        required: true
        default: all
        type: choice
        options:
          - all
          - terminal
          - web
          - gui
          - mobile

permissions:
  contents: read

jobs:
  version:
    name: Derive development version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Derive artifact version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          SURFACE: ${{ inputs.surface }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            version=${GITHUB_REF_NAME#v}
          else
            latest=$(./scripts/latest-version.sh)
            base_version=$(./scripts/next-version.sh patch)
            if [[ -n "$latest" && "$SURFACE" != all ]]; then
              assets_file="$RUNNER_TEMP/release-assets.txt"
              if ! gh release view "v$latest" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > "$assets_file"; then
                : > "$assets_file"
              fi
              missing=$(./scripts/release-surfaces.sh missing "$SURFACE" "$latest" "$assets_file")
              if [[ -n "$missing" ]]; then
                base_version=$latest
              fi
            fi
            version="$base_version-dev.${GITHUB_SHA:0:12}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

  build:
    name: Build selected surfaces
    needs: version
    uses: ./.github/workflows/_build-surfaces.yml
    with:
      surface: ${{ inputs.surface }}
      version: ${{ needs.version.outputs.version }}
      production: false
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
