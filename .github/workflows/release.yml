name: Release
run-name: Release ${{ inputs.surface }} · ${{ inputs.bump }}

on:
  workflow_dispatch:
    inputs:
      surface:
        description: Surface to publish (all publishes every surface)
        required: true
        default: all
        type: choice
        options:
          - all
          - terminal
          - web
          - gui
          - mobile
      bump:
        description: Semantic version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  version:
    name: Reserve next version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "Releases must run from the default branch ($DEFAULT_BRANCH), got $GITHUB_REF_NAME" >&2
            exit 2
          fi

      - name: Check out source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Calculate next semantic version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          git fetch --force --tags origin
          version=$(./scripts/next-version.sh "$BUMP")
          tag="v$version"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            echo "Tag already exists: $tag" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $tag"

  build:
    name: Build selected surfaces
    needs: version
    uses: ./.github/workflows/_build-surfaces.yml
    with:
      surface: ${{ inputs.surface }}
      version: ${{ needs.version.outputs.version }}

  publish:
    name: Publish GitHub release
    needs:
      - version
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create version tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          SURFACE: ${{ inputs.surface }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "pi-go $TAG" \
            --notes "Built surface selection: $SURFACE. All archives are versioned as $VERSION; verify downloads with SHA256SUMS." \
            --generate-notes
